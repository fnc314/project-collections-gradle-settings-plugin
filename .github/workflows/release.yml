name: Release Artifacts & Docs

on:
  push:
    tags:
      - "version/*"
  workflow_dispatch:
    inputs:
      publish_plugins:
        description: "Publish to Gradle Plugin Portal"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Setup init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle/init.d/root.init.gradle.kts ~/.gradle/init.d/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Run verification checks
        run: ./gradlew check

  publish-packages:
    name: Publish to GitHub Packages
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Setup init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle/init.d/root.init.gradle.kts ~/.gradle/init.d/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish Maven artifacts to GitHub Packages
        run: ./gradlew :project-collections-gradle-settings-plugin:publishGprPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-portal:
    name: Publish to Gradle Plugin Portal
    needs: build-and-test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_plugins }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Setup init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle/init.d/root.init.gradle.kts ~/.gradle/init.d/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish Plugin to Gradle Plugin Portal
        run: ./gradlew :project-collections-gradle-settings-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  publish-docs:
    name: Generate & Deploy Dokka Docs
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Setup init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle/init.d/root.init.gradle.kts ~/.gradle/init.d/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Generate versioned Dokka documentation
        run: ./gradlew :project-collections-gradle-settings-plugin:dokkaVersion :project-collections-gradle-settings-plugin:dokkaCapture

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  create-github-release:
    name: Create GitHub Release
    needs: [publish-packages, publish-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
