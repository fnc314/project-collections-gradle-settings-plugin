concurrency:
  cancel-in-progress: false
  group: "pages"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "26"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Dokka documentation
        run: ./gradlew :project-collections-gradle-settings-plugin:dokkaCapture --init-script=./scripts/gradle/root.init.gradle.kts

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

name: Publish Dokka Docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "version/[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write
  pages: write
